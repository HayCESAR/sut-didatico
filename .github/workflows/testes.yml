name: testes

on:
  workflow_dispatch:

jobs:
  rapido:
    name: 'testando esteira'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout do SUT (commit em analise)
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name: checkout da TAS (onde vivem os testes)
        uses: actions/checkout@v5
        with:
          repository: SUA-CONTA/tas-cidade-conectada
          ref: main
          path: tas

      - name: onde eu estou
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: testes de unidade
        id: unidade
        working-directory: tas
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec  --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=relatorios/unidade.xml
        run: |
          mkdir -p relatorios
          npm run test:unidade