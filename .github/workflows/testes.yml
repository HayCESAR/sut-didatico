# .github/workflows/testes.yml
# Pipeline de testes · ADS033 · implementa a especificação do Capítulo 8
# Vive no repositório do SUT.

name: testes

# ===========================================================================
# PARTE 1 · GATILHOS
# Quando a esteira executa. Capítulo 8, seção "Gatilhos".
# ===========================================================================

on:
  push:
    paths-ignore: [ '**/*.md', 'lab/**' ]        # (1)
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'                          # 03h em Recife; o cron é UTC
  workflow_dispatch:
    inputs:
      estagios:
        description: 'Quais estágios executar'
        required: true
        default: '1+2'
        type: choice
        options: [ '1+2', '1+2+3', '4' ]

# ===========================================================================
# PARTE 2 · CONFIGURAÇÃO GLOBAL
# Valores que todos os estágios compartilham. Nada de endereço ou versão
# escrito dentro dos passos.
# ===========================================================================

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '24'
  MAESTRO_VERSION: '2.9.0'
  TAS_REPO: 'HayCESAR/tas-cidade-conectada'      # Ajuste de acordo com owner/repo da TAS do seu projeto
  TAS_REF: 'main'
  PORT: '3000'
  BASE_URL: 'http://localhost:3000'

jobs:

  # =========================================================================
  # PARTE 3 · ESTÁGIOS 1 e 2: build, unidade e API
  # Gate G1: bloqueia o merge. Roda em todo push e em todo pull request.
  # =========================================================================

  rapido:
    name: 'estagios 1 e 2: build, unidade e API'
    if: github.event_name != 'workflow_dispatch' || inputs.estagios != '4'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # ---- 3.1 Preparação do ambiente -------------------------------------
      - name: checkout do SUT (commit em analise)
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name: checkout da TAS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TAS_REPO }}
          ref: ${{ env.TAS_REF }}
          path: tas

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: declara as versoes em uso
        run: |
          echo "gatilho: ${{ github.event_name }}"
          echo "estagios: ${{ inputs.estagios || '(definido pelo gatilho)' }}"
          node --version
          echo "SUT: $(git -C sut-didatico rev-parse --short HEAD)"
          echo "TAS: $(git -C tas rev-parse --short HEAD)"

      # ---- 3.2 Estágio 1: verificação da TAS e testes de unidade -----------
      - name: verificacao de configuracao da TAS
        run: |
          set -e
          test -f sut-didatico/regras-status.js || { echo "::error::regras-status.js ausente"; exit 1; }
          test -f sut-didatico/server.js        || { echo "::error::server.js ausente"; exit 1; }
          test -d tas/tests/unidade && test -d tas/tests/api
          echo "estrutura esperada confirmada"

      - name: testes de unidade
        id: unidade
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/unidade.xml \
            "tests/unidade/**/*.test.js"

      # ---- 3.3 Disponibilização do SUT ------------------------------------
      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda o SUT responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "SUT respondeu em ${i}s (HTTP $code)"; exit 0
            fi
            sleep 1
          done
          echo "::error::SUT nao respondeu em 60s"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || echo "(log vazio)"
          exit 1

      # ---- 3.4 Estágio 2: suíte de API ------------------------------------
      - name: estado inicial conhecido
        run: |
          curl -s -X POST "$BASE_URL/api/v1/_test/reset" -o /dev/null -w 'reset: %{http_code}\n'

      - name: suite de API
        id: api
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/api.xml \
            "tests/api/**/*.test.js"

      # ---- 3.5 Diagnóstico e evidências -----------------------------------
      - name: diagnostico pos-falha
        if: failure()
        run: |
          {
            echo "### Diagnostico"
            echo "Health apos a falha: \`$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || echo 'sem resposta')\`"
            echo '```'
            tail -n 80 "$GITHUB_WORKSPACE/sut.log" 2>/dev/null || echo "(sem log do SUT)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: resumo dos estagios
        if: always()
        run: |
          {
            echo "## Estagios 1 e 2"
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| unidade | ${{ steps.unidade.outcome }} |"
            echo "| api | ${{ steps.api.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publica evidencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-rapido-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
          retention-days: 14
          if-no-files-found: warn

  # =========================================================================
  # PARTE 4 · ESTÁGIO 3: smoke E2E
  # Gate G2: bloqueia a entrega, não o merge. Roda por rótulo `rodar-e2e`
  # no pull request, ou por execução manual.
  # =========================================================================

  e2e:
    name: 'estagio 3: smoke E2E'
    needs: rapido
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.estagios == '1+2+3') ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'rodar-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ---- 4.1 Preparação do ambiente e do SUT ----------------------------
      - name: checkout do SUT (commit em analise)
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name: checkout da TAS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TAS_REPO }}
          ref: ${{ env.TAS_REF }}
          path: tas

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda a UI web responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/web" || true)
            if [ "$code" = "200" ]; then echo "UI web no ar em ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::UI web nao respondeu em 60s"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || true
          exit 1

      # ---- 4.2 Ferramenta de E2E ------------------------------------------
      - name: cache do Maestro
        uses: actions/cache@v5
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: instala o Maestro
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          export MAESTRO_VERSION="${{ env.MAESTRO_VERSION }}"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: confere a versao instalada
        run: |
          instalada=$(maestro --version 2>&1)
          echo "instalado: $instalada / esperado: $MAESTRO_VERSION"
          if ! printf '%s' "$instalada" | grep -qF "$MAESTRO_VERSION"; then
            echo "::error::versao do Maestro diferente da fixada em MAESTRO_VERSION"
            exit 1
          fi

      - name: garante o display virtual
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi
          echo "chrome: $(google-chrome --version 2>/dev/null || echo 'ausente')"

      # ---- 4.3 Execução e evidências --------------------------------------
      - name: estado inicial conhecido
        run: curl -s -X POST "$BASE_URL/api/v1/_test/reset" -o /dev/null

      - name: fluxos de smoke
        working-directory: tas
        run: |
          mkdir -p relatorios
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            maestro test tests/e2e/maestro \
              --include-tags smoke \
              --format junit \
              --output relatorios/maestro-junit.xml

      - name: publica evidencias do E2E
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-e2e-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
            ~/.maestro/tests/
          retention-days: 14
          if-no-files-found: warn

  # =========================================================================
  # PARTE 5 · ESTÁGIO 4: regressão completa, noturna
  # Gate G3: não bloqueia nada. Cobre unidade, API e todos os fluxos E2E
  # sobre uma única inicialização do SUT, e abre item de manutenção ao falhar.
  # =========================================================================

  regressao:
    name: 'estagio 4: regressao completa'
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.estagios == '4')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      issues: write

    steps:
      # ---- 5.1 Preparação do ambiente e do SUT ----------------------------
      - name: checkout do SUT (commit em analise)
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name: checkout da TAS
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TAS_REPO }}
          ref: ${{ env.TAS_REF }}
          path: tas

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup node server.js > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda o SUT responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then exit 0; fi
            sleep 1
          done
          echo "::error::SUT nao respondeu em 60s"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || true
          exit 1

      # ---- 5.2 Ferramenta de E2E ------------------------------------------
      - name: cache do Maestro
        uses: actions/cache@v5
        with:
          path: ~/.maestro
          key: maestro-${{ runner.os }}-${{ env.MAESTRO_VERSION }}

      - name: instala o Maestro
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          export MAESTRO_VERSION="${{ env.MAESTRO_VERSION }}"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: garante o display virtual
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y xvfb
          fi

      # ---- 5.3 Execução das suítes ----------------------------------------
      - name: suites de unidade e API
        id: node
        continue-on-error: true
        working-directory: tas
        run: |
          mkdir -p relatorios
          node --test \
            --test-reporter=spec  --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=relatorios/regressao.xml \
            "tests/**/*.test.js"

      - name: estado inicial conhecido
        run: curl -s -X POST "$BASE_URL/api/v1/_test/reset" -o /dev/null

      - name: todos os fluxos E2E
        id: maestro
        continue-on-error: true
        working-directory: tas
        run: |
          xvfb-run -a --server-args="-screen 0 1280x1024x24" \
            maestro test tests/e2e/maestro \
              --format junit \
              --output relatorios/maestro-regressao.xml

      # ---- 5.4 Veredito, evidências e item de manutenção -------------------
      - name: veredito da regressao
        id: veredito
        run: |
          node_r='${{ steps.node.outcome }}'
          maestro_r='${{ steps.maestro.outcome }}'
          {
            echo "## Regressao noturna"
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| unidade + api | $node_r |"
            echo "| e2e (todos os fluxos) | $maestro_r |"
          } >> "$GITHUB_STEP_SUMMARY"

          falhas=''
          [ "$node_r" != 'success' ] && falhas="$falhas unidade/api"
          [ "$maestro_r" != 'success' ] && falhas="$falhas e2e"
          echo "falhas=$(echo $falhas)" >> "$GITHUB_OUTPUT"
          if [ -n "$falhas" ]; then
            echo "::error::regressao reprovou em:$falhas"
            exit 1
          fi

      - name: publica evidencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-regressao-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
            ~/.maestro/tests/
          retention-days: 30
          if-no-files-found: warn

      - name: abre item de manutencao
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Regressao noturna reprovou em $(date +%F): ${{ steps.veredito.outputs.falhas }}" \
            --body "Execucao: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label manutencao