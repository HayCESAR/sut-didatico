name: estagio 1 e 2

on:
  push:
    paths-ignore: [ '**/*.md', 'docs/**' ]
  workflow_dispatch:

env:
  BASE_URL: 'http://localhost:3000'
  MAESTRO_VERSION: '2.9.0'

jobs:
  regressao:
    name: 'estagio 1 e 2: build, testes de unidade e de api'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: checkout do SUT (commit em analise)
        uses: actions/checkout@v5
        with:
          path: sut-didatico

      - name: checkout da TAS (onde vivem os testes)
        uses: actions/checkout@v5
        with:
          repository: HayCESAR/tas-cidade-conectada
          ref: main
          path: tas

      - name: onde eu estou
        run: |
          echo "workspace: $GITHUB_WORKSPACE"
          ls -la "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: suite de unitarios
        id: unidade
        working-directory: tas
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec  --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=relatorios/unidade.xml
        run: |
          mkdir -p relatorios
          npm run test:unidade
      
      - name: sobe o SUT didatico em segundo plano
        working-directory: sut-didatico
        run: nohup npm start > "$GITHUB_WORKSPACE/sut.log" 2>&1 &

      - name: aguarda o SUT responder
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || true)
            if [ "$code" = "401" ] || [ "$code" = "200" ]; then
              echo "SUT respondeu em ${i}s (HTTP $code)"; exit 0
            fi
            sleep 1
          done
          echo "::error::SUT nao respondeu em 60s"
          tail -n 50 "$GITHUB_WORKSPACE/sut.log" || echo "(log vazio)"
          exit 1
      
      - name: suite de API
        id: api
        working-directory: tas
        env:
          NODE_OPTIONS: >-
            --test-reporter=spec  --test-reporter-destination=stdout
            --test-reporter=junit --test-reporter-destination=relatorios/api.xml
        run: |
          mkdir -p relatorios
          npm run test:api
      
      - name: diagnostico pos-falha
        if: failure()
        run: |
          {
            echo "### Diagnostico"
            echo "Health apos a falha: \`$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/api/v1/demands" || echo 'sem resposta')\`"
            echo '```'
            tail -n 80 "$GITHUB_WORKSPACE/sut.log" 2>/dev/null || echo "(sem log do SUT)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: resumo dos estagios
        if: always()
        run: |
          {
            echo "## Estagio 4"
            echo "| Suite | Resultado |"
            echo "|---|---|"
            echo "| unidade | ${{ steps.unidade.outcome }} |"
            echo "| api | ${{ steps.api.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: publica evidencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: evidencias-unidade-${{ github.run_id }}
          path: |
            tas/relatorios/
            sut.log
          retention-days: 14
          if-no-files-found: warn
      
      - name: veredito da regressao
        id: veredito
        if: always()
        run: |
          unidade_result='${{ steps.unidade.outcome }}'
          api_result='${{ steps.api.outcome }}'
          falhas=''
          [ "$unidade_result" == 'failure' ] && falhas="$falhas unidade"
          [ "$api_result" == 'failure' ] && falhas="$falhas api"
          echo "falhas=$(echo $falhas)" >> "$GITHUB_OUTPUT"
          if [ -n "$falhas" ]; then
            echo "::error::a verificação rápida reprovou em:$falhas"; exit 1
          fi

      - name: abre item de manutencao
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create \
            --title "A verificação rápida reprovou em $(date +%F): suite de ${{ steps.veredito.outputs.falhas }}" \
            --body "Execucao: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label manutencao